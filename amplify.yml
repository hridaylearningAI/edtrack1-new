version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install dependencies using pnpm (as indicated by pnpm-lock.yaml)
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        # Build the Next.js application
        - pnpm run build
  artifacts:
    # Next.js static export directory
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - pnpm-lock.yaml
